{% for field in form %}{% if not field.is_hidden %}
<div class="form-row{% if field.field.widget.input_type == 'checkbox' %} check{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}<label>{{ field }} {{ field.label }}</label>
  {% else %}<label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% endif %}
  {% if field.help_text %}<span class="help">{{ field.help_text }}</span>{% endif %}
  {% for e in field.errors %}<span class="field-error">{{ e }}</span>{% endfor %}
</div>
{% else %}{{ field }}{% endif %}{% endfor %}
