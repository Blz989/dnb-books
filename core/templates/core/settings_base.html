{% extends "core/base.html" %}
{% block breadcrumb %}<div class="crumb"><a href="{% url 'settings:index' %}">Settings</a></div>{% endblock %}
{% block content %}
<div class="split">
  <nav class="subnav" aria-label="Settings">
    <div class="subnav-h">Organization</div>
    <a href="{% url 'settings:company' %}"{% if settings_section == "company" %} class="on"{% endif %}>Company profile</a>
    <a href="{% url 'settings:users' %}"{% if settings_section == "users" %} class="on"{% endif %}>Users and roles</a>
    <div class="subnav-h">Modules</div>
    <a href="{% url 'sales:settings' %}"{% if settings_section == "sales" %} class="on"{% endif %}>Sales</a>
    <a href="{% url 'purchasing:settings' %}"{% if settings_section == "purchasing" %} class="on"{% endif %}>Purchases</a>
    <a href="{% url 'items:settings' %}"{% if settings_section == "inventory" %} class="on"{% endif %}>Inventory</a>
    <a href="{% url 'handling:settings' %}"{% if settings_section == "handling" %} class="on"{% endif %}>Handling</a>
    <div class="subnav-h">System</div>
    <a href="{% url 'settings:audit' %}"{% if settings_section == "audit" %} class="on"{% endif %}>Audit log</a>
    <a href="{% url 'settings:advanced' %}"{% if settings_section == "advanced" %} class="on"{% endif %}>Advanced</a>
  </nav>
  <section class="split-main">
    {% block settings_content %}{% endblock %}
  </section>
</div>
{% endblock %}
