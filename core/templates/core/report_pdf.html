<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}Report{% endblock %}</title>
<style>
@font-face { font-family: "Inter"; font-weight: 100 900; src: url("{{ pdf_font_uri }}/inter-latin-wght-normal.woff2") format("woff2"); }
@font-face { font-family: "Source Serif 4"; font-weight: 600; src: url("{{ pdf_font_uri }}/source-serif-4-latin-600-normal.woff2") format("woff2"); }
</style>
</head>
<body{% if wide %} class="wide"{% endif %}>
<header class="head">
  <div class="co">{% if pdf_logo_uri %}<img class="logo" src="{{ pdf_logo_uri }}" alt="">{% endif %}<div><b>{{ brand.name }}</b></div></div>
  <div class="printed">Printed {% now "M j, Y g:i a" %}</div>
</header>
<h1>{% block page_title %}Report{% endblock %}</h1>
{% block page_subtitle %}{% endblock %}
<main>{% block content %}{% endblock %}</main>
</body>
</html>
