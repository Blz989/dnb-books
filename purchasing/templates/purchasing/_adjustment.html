<h2 style="margin:12px 16px 0">Adjustment</h2>
<div class="body form-grid">
  <p class="help" style="grid-column:1/-1;margin:0">Use a minus sign to lower the bill, for example -10.00. Leave it blank for none.</p>
  {% for field in adj_form %}
  <div class="form-row"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}
    {% for e in field.errors %}<span class="field-error">{{ e }}</span>{% endfor %}</div>
  {% endfor %}
</div>
