# Start:   docker compose up -d --build
# Update:  ./update.sh
services:
  app:
    build: .
    image: dnb-books
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    restart: unless-stopped

  scheduler:
    image: dnb-books
    env_file: .env
    environment:
      DNB_SKIP_MIGRATE: "1"   # the app service migrates; avoid two migrations at once
    command: ["python", "manage.py", "run_scheduler"]
    volumes:
      - ./data:/data
    depends_on:
      - app
    restart: unless-stopped

  # Claude (MCP) service. Reached only through the Cloudflare tunnel; every request needs a valid
  # Cloudflare Access token. See README, "Use DNB Books from Claude".
  mcp:
    image: dnb-books
    env_file: .env
    environment:
      DNB_SKIP_MIGRATE: "1"
    command: ["python", "manage.py", "serve_mcp", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    volumes:
      - ./data:/data
    depends_on:
      - app
    restart: unless-stopped
