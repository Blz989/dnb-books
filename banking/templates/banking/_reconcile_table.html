<div class="card">
  <table class="data">
    <thead><tr><th style="width:36px"></th><th>Date</th><th>Number</th><th>Description</th><th class="num">Amount</th></tr></thead>
    <tbody>
    {% for r in rows %}
      <tr><td><input type="checkbox" name="cleared" value="{{ r.item_id }}" data-toggle-url="{% url 'banking:reconcile-toggle' account.pk rec.pk r.item_id %}"{% if r.cleared %} checked{% endif %} aria-label="Cleared: {{ r.number }}"></td>
        <td style="white-space:nowrap">{{ r.date|date:"Y-m-d" }}</td><td>{{ r.number }}</td><td>{{ r.description }}</td><td class="num">{{ r.amount|floatformat:"2g" }}</td></tr>
    {% empty %}<tr><td colspan="5" class="empty">{{ empty }}</td></tr>
    {% endfor %}
    </tbody>
  </table>
</div>
