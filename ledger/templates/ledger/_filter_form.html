<form method="get" class="filters">
  {{ form.non_field_errors }}
  {% for field in form %}
    <label>{{ field.label }} {{ field }}
    {% for error in field.errors %}<span class="field-error">{{ error }}</span>{% endfor %}</label>
  {% endfor %}
  <button type="submit" class="btn primary">Run</button>
  {% if report %}<button type="submit" name="format" value="csv" class="btn">Download CSV</button>{% endif %}
</form>
